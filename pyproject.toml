[project]
name = "prizmanyx-foundry"
version = "0.1.0"
description = "Standalone operator tool that manufactures Floci-backed AWS test estates and drives Prizmanyx's pipeline against them from outside."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
foundry = "foundry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
    "ARG", # flake8-unused-arguments
]
